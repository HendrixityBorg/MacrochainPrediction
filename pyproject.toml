[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-gold-latent-s"
version = "0.1.0"
description = "Auditable multi-measurement latent macro-to-gold uncertainty"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.8,<4"]

[project.scripts]
macro-gold-s = "macro_gold_latent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

